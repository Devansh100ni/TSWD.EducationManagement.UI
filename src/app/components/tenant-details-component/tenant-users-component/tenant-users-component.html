<div class="vh-75">
  <div class="row p-2 mb-2">
    <div class="d-flex col-md-6 justify-content-start">
      <h4>Users</h4>
    </div>
    <div class="d-flex col-md-6 justify-content-end">
      <button class="btn btn-primary" type="button" (click)="open(content)">Add</button>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <app-search-component
        [serviceFn]="searchUsers"
        placeholder="Search User..."
        displayField="fullName"
        valueField="id"
      ></app-search-component>
    </div>
  </div>

  <table class="table table-striped table-hover">
    <thead class="table table-bordered">
      <tr>
        <th>User Name</th>
        <th>Full Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Active</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (user of users; track user.id) {
      <tr>
        <td>{{ user.userName }}</td>
        <td>{{ user.fullName }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.roleName }}</td>
        <td>
          @if(user.isActive){
          <i class="bi bi-check-lg text-success fw-bolder"></i>
          } @else{
          <i class="bi bi-x-lg text-danger fw-bolder"></i>
          }
        </td>
        <td>
          <div class="dropdown">
            <button
              class="btn btn-primary dropdown-toggle"
              type="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              Action
            </button>
            <ul class="dropdown-menu">
              <li>
                <button
                  type="button"
                  class="dropdown-item"
                  [disabled]="!user?.id"
                  (click)="handleEdit(user.id, content)"
                >
                  Edit
                </button>
              </li>
            </ul>
          </div>
        </td>
      </tr>
      }
    </tbody>
  </table>
  <div class="row align-items-center position-relative">
    <div class="col-md-6">
      <pre>Current page: {{ page }}</pre>
    </div>
    <div class="col-md-6 d-flex justify-content-end">
      <ngb-pagination
        [collectionSize]="collectionSize"
        [(page)]="page"
        [pageSize]="pageSize"
        (pageChange)="pageChange()"
        [boundaryLinks]="true"
      >
      </ngb-pagination>
    </div>
  </div>
</div>

<ng-template #content let-modal>
  <div class="modal-header">
    @if(userId){
    <h4 class="modal-title" id="modal-basic-title">Edit User</h4>
    } @else {
    <h4 class="modal-title" id="modal-basic-title">Add User</h4>
    }
  </div>

  <div class="modal-body">
    <form [formGroup]="form">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label>User Name</label>
          <input type="text" class="form-control" formControlName="userName" />
        </div>
        <div class="col-md-6 mb-3">
          <label>Email</label>
          <input type="text" class="form-control" formControlName="email" />
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label>Name</label>
          <input type="text" class="form-control" formControlName="name" />
        </div>
        <div class="col-md-6 mb-3">
          <label>Surname</label>
          <input type="text" class="form-control" formControlName="surname" />
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label>Phone Number</label>
          <input type="text" class="form-control" formControlName="phoneNumber" />
        </div>
        <div class="col-md-6 mb-3">
          <label>Role</label>
          <select class="form-control" formControlName="roleId">
            <option disabled="true" selected>Select Role</option>
            @for (role of roles; track role.id) {
            <option [value]="role.id">{{ role.name }}</option>
            }
          </select>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3 d-flex align-items-center">
          <div class="form-check mt-4">
            <input
              type="checkbox"
              class="form-check-input"
              formControlName="isActive"
              id="isActive"
            />
            <label for="isActive" class="form-check-label">Is Active</label>
          </div>
        </div>
        <div class="col-md-6 mb-3 d-flex align-items-center">
          <div class="form-check mt-4">
            <input
              type="checkbox"
              class="form-check-input"
              formControlName="shouldChangePasswordOnNextLogin"
              id="shouldChangePasswordOnNextLogin"
            />
            <label for="shouldChangePasswordOnNextLogin" class="form-check-label"
              >Change Password On Next Login</label
            >
          </div>
        </div>
      </div>
    </form>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-outline-secondary" (click)="closeModal(modal, 'cancel')">
      Cancel
    </button>
    <button type="button" class="btn btn-primary" (click)="onSubmit(modal)">Save</button>
  </div>
</ng-template>
